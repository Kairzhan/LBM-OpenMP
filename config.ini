################################
# output control
################################
noutput3 = 1000
noutput2 = 200
ndump = 2000

################################
# flow statistics control
################################
ndiag = 100
nstat = 200

################################
# device configuration
################################
gpus_per_thread = 1

################################
# turbulence parameters
################################
perturb = false
