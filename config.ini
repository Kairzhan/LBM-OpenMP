################################
# mesh configuration
################################
grid = 256, 256, 256
boundary_types = periodic, periodic, periodic, periodic, periodic, periodic

################################
# physical parameters
################################
viscosity = 0.016
gravity =    0.0, -0.1, -9.8
ambient_force =    0.0, 0.0, 0.0

################################
# timestep control
################################
